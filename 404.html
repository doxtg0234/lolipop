<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Page Not Found | FilmyFly</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#05060a">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#05060a;--text:#f8faff;--muted:#9aa4b8;--line:rgba(255,255,255,.1);--a:#7c5cff;--b:#00d9ff;--c:#ff3d81}
*{box-sizing:border-box}
html{min-height:100%;scroll-behavior:smooth}
body{margin:0;min-height:100vh;display:grid;place-items:center;overflow:hidden;color:var(--text);font-family:Inter,system-ui,sans-serif;background:
radial-gradient(circle at 15% 15%,rgba(124,92,255,.22),transparent 30%),
radial-gradient(circle at 85% 20%,rgba(0,217,255,.14),transparent 28%),
radial-gradient(circle at 50% 100%,rgba(255,61,129,.10),transparent 35%),var(--bg)}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.22;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:52px 52px;mask-image:linear-gradient(to bottom,#000,transparent 88%)}
.wrap{width:min(760px,calc(100% - 32px));text-align:center;position:relative;z-index:2}
.logo{display:inline-flex;align-items:center;gap:10px;font:900 28px Outfit,sans-serif;letter-spacing:-1.1px;margin-bottom:42px}
.logo-mark{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--a),var(--b));box-shadow:0 0 35px rgba(124,92,255,.3);font-size:20px}
.logo-name{background:linear-gradient(90deg,#fff 15%,#bcaeff 52%,#5feaff 90%);-webkit-background-clip:text;background-clip:text;color:transparent}
.code{font:900 clamp(110px,24vw,210px)/.8 Outfit,sans-serif;letter-spacing:-10px;margin:0;background:linear-gradient(90deg,#fff 5%,#b9a8ff 42%,#63eaff 72%,#ff6ca8);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 70px rgba(124,92,255,.16)}
h1{font:800 clamp(28px,5vw,46px)/1.05 Outfit,sans-serif;letter-spacing:-1.8px;margin:34px 0 14px}
p{max-width:560px;margin:0 auto;color:var(--muted);font-size:15px;line-height:1.8}
.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:30px}
a{color:inherit;text-decoration:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:14px 20px;border-radius:13px;border:1px solid var(--line);font-size:14px;font-weight:800;transition:.25s}
.btn-main{background:linear-gradient(135deg,var(--a),#5f8cff);box-shadow:0 14px 40px rgba(124,92,255,.28)}
.btn-ghost{background:rgba(255,255,255,.045)}
.btn:hover{transform:translateY(-3px)}
.btn-ghost:hover{background:rgba(255,255,255,.09)}
.orb{position:fixed;width:440px;height:440px;border-radius:50%;left:50%;top:50%;transform:translate(-50%,-52%);background:radial-gradient(circle,rgba(124,92,255,.08),transparent 68%);filter:blur(3px);pointer-events:none}
@media(max-width:560px){.logo{margin-bottom:30px}.code{letter-spacing:-6px}.actions{margin-top:24px}.btn{width:100%;max-width:300px}}
</style>
</head>
<body>
<div class="orb" aria-hidden="true"></div>
<main class="wrap">
  <a class="logo" href="/" aria-label="FilmyFly home">
    <span class="logo-mark">▶</span>
    <span class="logo-name">FilmyFly</span>
  </a>
  <div class="code" aria-hidden="true">404</div>
  <h1>Oops! This page flew away.</h1>
  <p>The page you’re looking for doesn’t exist, may have moved, or the URL may be incorrect. Let’s get you back to FilmyFly.</p>
  <div class="actions">
    <a class="btn btn-main" href="/">← Back to FilmyFly</a>
    <a class="btn btn-ghost" href="javascript:history.back()">Go Back</a>
  </div>
</main>
</body>
</html>
